name: Lua regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtimes
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - name: Check syntax
        run: find leadingmangazoom.koplugin tests -name '*.lua' -exec luac5.1 -p {} \;
      - name: Run Lua 5.1 tests
        run: lua5.1 tests/run.lua
      - name: Run LuaJIT tests
        run: luajit tests/run.lua
  koreader-touch-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        koreader: [v2026.03, v2026.07.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: koreader/koreader
          ref: ${{ matrix.koreader }}
          path: .koreader
          sparse-checkout: frontend
      - uses: actions/checkout@v4
        with:
          repository: koreader/koreader-base
          path: .koreader-base
          sparse-checkout: ffi
      - name: Install LuaJIT, libarchive and zip
        run: sudo apt-get update && sudo apt-get install -y luajit libarchive13 zip
      - name: Test real KOReader touch dispatch, key matching and updater unpacking
        env:
          KOREADER_SOURCE: .koreader
          KOREADER_BASE: .koreader-base
        run: luajit tests/run.lua
